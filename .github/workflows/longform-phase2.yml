# Longform Phase 2 — 이미지 다운로드 + FFmpeg 합성 + YouTube 업로드
# 매일 KST 10:00 (UTC 01:00) 실행 — Phase 1로부터 11시간 후
name: Longform Phase 2 - Compose & Upload

on: 'workflow_dispatch'
  # schedule:
  #   - cron: '0 1 * * *'    # UTC 01:00 = KST 10:00
  # workflow_dispatch:

concurrency:
  group: longform-phase2
  cancel-in-progress: false

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_CLOUD_SA_JSON: ${{ secrets.GOOGLE_CLOUD_SA_JSON }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET || 'short-mystery-ai' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN_MYSTERY: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MYSTERY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      YOUTUBE_ATTRIBUTION_FOOTER: ${{ secrets.YOUTUBE_ATTRIBUTION_FOOTER }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Ensure output directory
        run: mkdir -p output

      - name: Install FFmpeg + edge-tts (무료 TTS)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Run Phase 2 (compose & upload)
        run: node src/longformPhase2.js
