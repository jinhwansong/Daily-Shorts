name: Noctivault Worker

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "produce: 제작 / request: JSON 관리 명령 / sync-youtube: Studio 상태 대조"
        type: choice
        options: [produce, request, sync-youtube]
        default: produce
      genre:
        description: 준비된 콘텐츠 형식
        type: choice
        options: [mystery, mystery-long]
        default: mystery
      request_json:
        description: 'request 전용 JSON. 예: {"command":"status"}. API 키는 입력하지 마세요.'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: pipeline-mystery
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN_MYSTERY: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MYSTERY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      WORKER_GENRE: ${{ inputs.genre || 'mystery' }}
      DAILY_UPLOAD_COUNT: ${{ vars.DAILY_UPLOAD_COUNT }}
      SUBTITLE_FONT_NAME: ${{ vars.SUBTITLE_FONT_NAME }}
      SUBTITLE_FONT_SIZE: ${{ vars.SUBTITLE_FONT_SIZE }}
      SUBTITLE_PRIMARY_ABGR: ${{ vars.SUBTITLE_PRIMARY_ABGR }}
      SUBTITLE_SECONDARY_ABGR: ${{ vars.SUBTITLE_SECONDARY_ABGR }}
      SUBTITLE_OUTLINE_ABGR: ${{ vars.SUBTITLE_OUTLINE_ABGR }}
      SUBTITLE_BACK_ABGR: ${{ vars.SUBTITLE_BACK_ABGR }}
      SUBTITLE_BACK_BOX: ${{ vars.SUBTITLE_BACK_BOX }}
      SUBTITLE_BOLD: ${{ vars.SUBTITLE_BOLD }}
      SUBTITLE_SPACING: ${{ vars.SUBTITLE_SPACING }}
      SUBTITLE_OUTLINE: ${{ vars.SUBTITLE_OUTLINE }}
      SUBTITLE_SHADOW: ${{ vars.SUBTITLE_SHADOW }}
      SUBTITLE_PLACEMENT: ${{ vars.SUBTITLE_PLACEMENT }}
      SUBTITLE_MARGIN_LR: ${{ vars.SUBTITLE_MARGIN_LR }}
      SUBTITLE_MARGIN_V: ${{ vars.SUBTITLE_MARGIN_V }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm ci
      - run: npm run build
      - name: Sync publication state from YouTube Studio
        if: inputs.operation != 'request'
        run: node dist/main.js --sync-youtube
      - name: Run one management request
        if: inputs.operation == 'request'
        env:
          WORKER_REQUEST: ${{ inputs.request_json }}
        run: |
          node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/request.json', process.env.WORKER_REQUEST || '', {mode: 0o600})"
          node dist/main.js --request="$RUNNER_TEMP/request.json"
      - name: Produce one reserved content item up to private upload
        if: inputs.operation == 'produce' || inputs.operation == ''
        run: node dist/main.js --run-once --genre="$WORKER_GENRE"
