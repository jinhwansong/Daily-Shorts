# 미스터리/괴담 — 매일 UTC 12:00 (한국 21:00 / 미국 동부 08:00)
name: Mystery Pipeline

on:
  schedule:
    - cron: '17 12 * * *' # UTC 12:17
    - cron: '43 15 * * *' # UTC 15:43
    - cron: '7 18 * * *' # UTC 18:07
    - cron: '31 21 * * *' # UTC 21:31
    - cron: '53 00 * * *' # UTC 00:53
  workflow_dispatch: # 수동 실행용

concurrency:
  group: pipeline-mystery
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN_MYSTERY: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MYSTERY }}
      # 선택: private(기본) | unlisted | public — 비우면 코드 기본(private)
      YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
      # 선택: Freesound CC0 배경음 — 비워 두면 로컬 assets/bgm 또는 무 BGM
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      # 선택: 설명란 하단 고정 저작권·출처 (Repository secret, 여러 줄 가능)
      YOUTUBE_ATTRIBUTION_FOOTER: ${{ secrets.YOUTUBE_ATTRIBUTION_FOOTER }}
      # 선택: SCRIPT_LLM_PROVIDER=google 등 롱폼·스크립트 경로에서 Gemini 사용 시
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      # 주제 중복 방지용 JSON — 러너가 매번 새로여도 이전 실행과 이어짐
      - name: Restore used-topics cache
        id: topics-cache
        uses: actions/cache@v4
        with:
          path: output/used_topics_mystery.json
          key: used-topics-mystery-${{ github.run_id }}
          restore-keys: |
            used-topics-mystery-

      - name: Ensure output directory
        run: mkdir -p output

      - name: Install FFmpeg + edge-tts (무료 TTS)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run mystery pipeline (1 video)
        run: node src/index.js --run-daily --genre=mystery --count=1

      - name: Save used-topics cache
        if: always() && hashFiles('output/used_topics_mystery.json') != ''
        uses: actions/cache/save@v4
        with:
          path: output/used_topics_mystery.json
          key: used-topics-mystery-${{ github.run_id }}-${{ hashFiles('output/used_topics_mystery.json') }}
